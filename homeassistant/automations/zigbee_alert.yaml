alias: "🐝 Supervision ZigBee – Alerte capteurs hors ligne"
description: "Alerte Telegram si un capteur ZigBee ne communique plus depuis 24 heures."
trigger:
  - platform: time_pattern
    minutes: "/15"

condition:
  - condition: state
    entity_id: input_boolean.supervision_zigbee_active
    state: "on"

action:
  - variables:
      offline_sensors: >-
        {% set result = namespace(sensors=[]) %}
        {% for state in states.sensor
            | selectattr('attributes.device_class', 'defined')
            | selectattr('attributes.device_class', '==', 'timestamp') %}
          {% if 'last_seen' in state.entity_id %}
            {% set s = states(state.entity_id) %}
            {% if s == 'unavailable'
               or (as_timestamp(now()) - as_timestamp(s)) > (24*3600) %}
              {% set result.sensors = result.sensors + [state.name] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ result.sensors }}

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ offline_sensors | length > 0 }}"
        sequence:
          - service: telegram_bot.send_photo
            data:
              file: /config/www/zigbee.png
              caption: >-
                🐝 **Supervision ZigBee — Capteurs hors ligne :**  
                {{ offline_sensors | join('\n') }}
              inline_keyboard:
                - "❌ 5 min:/disable_zigbee_alert_5, ❌ 1h:/disable_zigbee_alert_60"
                - "❌ 2h:/disable_zigbee_alert_120, ❌ 6h:/disable_zigbee_alert_360"
                - "❌ 24h:/disable_zigbee_alert_1440"

mode: single
